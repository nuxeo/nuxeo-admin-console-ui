name: Unit-test

permissions:
  # Read access for code checkout and test execution
  contents: read
  
on:
  pull_request:
    branches:
      - dev
  workflow_call:
    inputs:
      branch:
        description: 'The current branch'
        default: dev
        type: string
        required: false
    secrets:
      NPM_PACKAGES_TOKEN:
        description: 'NPM_PACKAGES_TOKEN'
        required: true
      GIT_TOKEN:
        description: 'GIT_TOKEN'
        required: true
env:
  BRANCH_NAME: ${{ github.head_ref || inputs.branch || 'dev' }}

jobs:
  utest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.BRANCH_NAME }}

      - name: Remove .npmrc file if exists
        run: |
          if [ -f .npmrc ]; then
            rm .npmrc
          fi
      - uses: actions/setup-node@v4
        with:
          registry-url: 'https://packages.nuxeo.com/repository/npm-public/'
          node-version: 20
          scope: '@nuxeo'


      - name: Cache node modules
        id: cache-npm
        uses: actions/cache@v4
        env:
          cache-name: cache-node-modules
        with:
          # npm cache files are stored in `~/.npm` on Linux/macOS
          path: ~/.npm
          key: ${{ runner.os }}-build-${{ env.cache-name }}-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-build-${{ env.cache-name }}-
            ${{ runner.os }}-build-
            ${{ runner.os }}-

      - if: ${{ steps.cache-npm.outputs.cache-hit != 'true' }}
        name: List the state of node modules
        continue-on-error: true
        run: npm list

      - name: Install @angular/cli
        run: npm install -g @angular/cli
      

      - name: Install Dependencies
        working-directory: nuxeo-admin-console-web/angular-app
        run: npm install

      - name: Unit tests with Vitest
        id: vitest
        working-directory: nuxeo-admin-console-web/angular-app
        run: npm test
        continue-on-error: true

      - name: Check coverage results
        id: coverage-check
        if: always()
        working-directory: nuxeo-admin-console-web/angular-app
        run: |
          # Check if coverage summary exists
          if [ ! -f coverage/admin_console_ui/coverage-summary.json ]; then
            echo "❌ Coverage report not found"
            {
              echo '## ❌ Test Coverage'
              echo
              echo "No coverage report was produced at \`coverage/admin_console_ui/coverage-summary.json\`."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          
          # Parse coverage summary
          STATEMENTS=$(jq '.total.statements.pct' coverage/admin_console_ui/coverage-summary.json)
          BRANCHES=$(jq '.total.branches.pct' coverage/admin_console_ui/coverage-summary.json)
          FUNCTIONS=$(jq '.total.functions.pct' coverage/admin_console_ui/coverage-summary.json)
          LINES=$(jq '.total.lines.pct' coverage/admin_console_ui/coverage-summary.json)
          
          echo "statements=$STATEMENTS" >> $GITHUB_OUTPUT
          echo "branches=$BRANCHES" >> $GITHUB_OUTPUT
          echo "functions=$FUNCTIONS" >> $GITHUB_OUTPUT
          echo "lines=$LINES" >> $GITHUB_OUTPUT
          
          # Check if any coverage is below threshold
          THRESHOLD=80
          FAILED=false
          TABLE_ROWS=""
          
          # Gates one metric and collects its row for the job summary. Runs in the
          # current shell, so assignments to FAILED / TABLE_ROWS are visible below.
          check_metric() {
            local label="$1" key="$2" value="$3"
            if (( $(echo "$value < $THRESHOLD" | bc -l) )); then
              echo "${key}_failed=true" >> $GITHUB_OUTPUT
              FAILED=true
              TABLE_ROWS="${TABLE_ROWS}| **${label}** | ${value}% | ❌ Failed | ${THRESHOLD}% |"$'\n'
            else
              TABLE_ROWS="${TABLE_ROWS}| **${label}** | ${value}% | ✅ Passed | ${THRESHOLD}% |"$'\n'
            fi
          }
          
          check_metric Statements statements "$STATEMENTS"
          check_metric Branches branches "$BRANCHES"
          check_metric Functions functions "$FUNCTIONS"
          check_metric Lines lines "$LINES"
          
          # Overall coverage is reported in the job summary rather than as a PR
          # comment: the SonarCloud workflow already posts a single summary comment
          # that carries both new-code and overall coverage.
          {
            if [ "$FAILED" = true ]; then
              echo "## ❌ Test Coverage Failed"
            else
              echo "## ✅ Test Coverage Passed"
            fi
            echo
            echo '| Metric (overall) | Coverage | Status | Threshold |'
            echo '|------------------|----------|--------|-----------|'
            printf '%s' "$TABLE_ROWS"
          } >> "$GITHUB_STEP_SUMMARY"
          
          if [ "$FAILED" = true ]; then
            echo "coverage_passed=false" >> $GITHUB_OUTPUT
            exit 1
          else
            echo "coverage_passed=true" >> $GITHUB_OUTPUT
          fi

      - name: Fail workflow if coverage failed
        if: steps.coverage-check.outputs.coverage_passed != 'true'
        run: |
          echo "❌ Coverage check failed - some metrics are below 80% threshold"
          exit 1